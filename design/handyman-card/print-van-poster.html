<!doctype html>
<!--
  SUPERHMAN — van poster, 843 x 388 mm, tiled across 6 sheets of A4 landscape
  (3 columns x 2 rows).

  WHY TILED: large-format printing costs real money. Six A4 sheets cost almost
  nothing, go up today, and buy time until the business pays for proper vinyl.
  The renderer emits BOTH from this one file — the six tiles to print now, and
  the single full-size PDF to hand a sign shop later. Same artwork, no redraw.

  HOW IT ASSEMBLES: each sheet carries its tile centred with an 8 mm white
  margin, a cut line, and its grid position printed in the margin. Cut all six
  along the line — the label disappears with the waste — and butt the edges
  together. No overlap, no white seams.

  If the copy shop can print "a sangre" / borderless, ask for it and skip the
  cutting entirely.

  OUTDOORS: plain paper on a van in Florida lasts about one rain. Ask for
  adhesive vinyl, or glue the sheets to a coroplast panel and cover them with
  clear self-adhesive laminate. See the notes beside this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SUPERHMAN — van poster</title>
<style>
  @font-face{
    font-family:'Archivo';
    src:url('./assets/archivo.woff2') format('woff2');
    font-weight:400 900; font-stretch:62% 125%; font-display:block;
  }
  :root{
    --ground:#FFFFFF; --ink:#0E1116; --hero:#FF5C1A; --muted:#6B7078;
    --poster-w:843mm; --poster-h:388mm;
    --tile-w:281mm; --tile-h:194mm; --margin:8mm;
    --tx:0mm; --ty:0mm;            /* set per tile by the renderer */
  }
  :root.dark{ --ground:#0E1116; --ink:#FFFFFF; --muted:#A7ACB4; }

  *{box-sizing:border-box;margin:0;padding:0}
  html{font-family:'Archivo',system-ui,sans-serif}

  /* ---- the artwork itself, one piece ----
     Two rows across the full width: the brand leads, the number carries.
     At 843 mm wide there is room for both at full size, which is the whole
     reason to go big instead of arguing about what to leave out. ---- */
  .poster{
    width:var(--poster-w);height:var(--poster-h);background:var(--ground);color:var(--ink);
    display:flex;flex-direction:column;justify-content:center;gap:24mm;
    padding:26mm 30mm;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .brand{display:flex;align-items:center;gap:28mm}
  .mark{width:165mm;height:165mm;color:var(--hero);flex:none}
  .word{
    font-size:76mm;font-weight:800;font-stretch:104%;letter-spacing:.035em;
    line-height:.94;white-space:nowrap;
  }
  .word b{color:var(--hero);font-weight:800}

  .phone{
    font-size:92mm;font-weight:800;letter-spacing:-.015em;line-height:.94;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .trade{
    margin-top:15mm;font-size:14mm;font-weight:700;letter-spacing:.3em;
    text-transform:uppercase;color:var(--muted);
  }

  /* ---- full-size mode: the page IS the poster ---- */
  @page{ size:843mm 388mm; margin:0 }
  body{width:var(--poster-w);height:var(--poster-h)}
  .sheet{display:contents}

  /* ---- tiles mode: one A4 page per tile, all in one document ---- */
  html.tiles body{width:auto;height:auto;background:#fff}
  html.tiles .page{
    position:relative;width:297mm;height:210mm;overflow:hidden;
    page-break-after:always;break-after:page;
  }
  html.tiles .page:last-child{page-break-after:auto;break-after:auto}
  html.tiles .sheet{
    display:block;position:absolute;
    left:var(--margin);top:var(--margin);
    width:var(--tile-w);height:var(--tile-h);overflow:hidden;
  }
  html.tiles .poster{position:absolute;left:var(--tx);top:var(--ty)}
  html.tiles .cut{
    position:absolute;left:var(--margin);top:var(--margin);
    width:var(--tile-w);height:var(--tile-h);
    border:.25mm dashed rgba(14,17,22,.45);
  }
  html.tiles .id{
    position:absolute;left:0;right:0;bottom:1.6mm;text-align:center;
    font-size:3mm;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(14,17,22,.7);
  }
  .cut,.id{display:none}
  html.tiles .cut,html.tiles .id{display:block}
</style>
</head>
<body>
<!--TILE-UNIT-START-->
  <div class="sheet">
    <div class="poster">
      <div class="brand">
        <svg class="mark" viewBox="0 0 100 100" aria-label="SUPERHMAN">
          <path fill="currentColor" fill-rule="evenodd"
                d="M8 9h18v25h48V9h18v82H74V66H26v25H8Z M50 38 62 44v12l-12 6-12-6V44Z"/>
        </svg>
        <div class="word">SUPER<b>H</b>MAN</div>
      </div>
      <div>
        <!-- ==== EDIT ME: phone ==== -->
        <div class="phone">(645) 221-9200</div>
        <div class="trade">Handyman &middot; Insured</div>
      </div>
    </div>
  </div>
  <div class="cut"></div>
  <div class="id">cortar por la línea</div>
<!--TILE-UNIT-END-->
</body>
</html>
