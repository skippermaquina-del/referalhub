<!doctype html>
<!--
  SUPERHMAN — Facebook cover photo.

  Rendered at 1640 x 624 px by scripts/render-handyman-card.mjs. Facebook shows
  820 x 312 on desktop and crops the SIDES on phones (roughly the middle 1100px),
  so everything lives inside .safe, which is 66% of the width, dead centre.
  Desktop also drops the round profile picture over the bottom-left corner —
  another reason nothing important goes there.

  The canvas follows the viewport (100vw / 100vh) and every size is in vh, so the
  pixel count lives in the render script and this file never has to know it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SUPERHMAN — Facebook cover</title>
<style>
  @font-face{
    font-family:'Archivo';
    src:url('./assets/archivo.woff2') format('woff2');
    font-weight:400 900; font-stretch:62% 125%; font-display:block;
  }
  :root{ --ground:#0E1116; --ink:#FFFFFF; --hero:#FF5C1A; --muted:#A7ACB4; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-family:'Archivo',system-ui,sans-serif}
  body{
    width:100vw;height:100vh;background:var(--ground);color:var(--ink);
    display:flex;align-items:flex-start;justify-content:center;overflow:hidden;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .safe{width:66vw;display:flex;flex-direction:column;align-items:center;gap:3.4vh;
        align-self:flex-start;margin-top:6vh}
  .lockup{display:flex;align-items:center;gap:4vh}
  .mark{width:25vh;height:25vh;color:var(--hero);display:block;flex:none}
  .word{
    font-size:13vh;font-weight:800;font-stretch:106%;
    letter-spacing:.045em;line-height:.9;text-indent:.045em;white-space:nowrap;
  }
  .word b{color:var(--hero);font-weight:800}
  .tagline{
    margin-top:1.4vh;font-size:3.4vh;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;color:var(--muted);text-indent:.28em;white-space:nowrap;
  }
  .foot{display:flex;align-items:center;gap:3.4vh;white-space:nowrap}
  .phone{
    font-size:7.4vh;font-weight:800;letter-spacing:-.01em;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:var(--hero);flex:none}
  .zone{
    font-size:3vh;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);text-indent:.2em;
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 100 100" aria-label="SUPERHMAN">
        <path fill="currentColor" fill-rule="evenodd"
              d="M8 9h18v25h48V9h18v82H74V66H26v25H8Z M50 38 62 44v12l-12 6-12-6V44Z"/>
      </svg>
      <div>
        <div class="word">SUPER<b>H</b>MAN</div>
        <div class="tagline">Every home needs a hero</div>
      </div>
    </div>
    <div class="foot">
      <!-- ==== EDIT ME: phone + zone ==== -->
      <div class="phone">(645) 221-9200</div>
      <span class="dot"></span>
      <div class="zone">Broward &middot; Dade &middot; Boca</div>
    </div>
  </div>
</body>
</html>
